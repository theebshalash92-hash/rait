<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تقييم تجربة العميل</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <!-- شعار الشركة / اللوغو -->
    <div class="logo-container">
      <img src="logo.png" alt="شعار الشركة"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPDYYL6vP05GKSYtrIZpWN4H62myqKKSKzmOpGku2zyQ&s=10">
      <div id="logo-placeholder" class="logo-placeholder" style="display: none;">LOGO</div>
    </div>

    <!-- الشاشة الأولى: بيانات العميل -->
    <div id="step-1" class="step active">
      <h2>مرحباً بك!</h2>
      <p>يرجى إدخال بياناتك لمتابعة التقييم</p>
      
      <form id="customer-form">
        <div class="form-group">
          <label for="customerId">رقم العميل / الهاتف:</label>
          <input type="text" id="customerId" placeholder="أدخل رقم العميل" required>
        </div>

        <div class="form-group">
          <label for="customerName">اسم العميل:</label>
          <input type="text" id="customerName" placeholder="أدخل اسمك الكريم" required>
        </div>

        <button type="submit" class="btn">التالي</button>
      </form>
    </div>

    <!-- الشاشة الثانية: التقييم بالإيموجي -->
    <div id="step-2" class="step">
      <h2>كيف كانت تجربتك اليوم؟</h2>
      <p id="welcome-msg"></p>

      <div class="rating-emojis">
        <div class="emoji-option" data-value="5" data-text="راضي جداً">
          <span class="emoji-icon">🤩</span>
          <span class="emoji-label">راضي جداً</span>
        </div>
        <div class="emoji-option" data-value="3" data-text="راضي">
          <span class="emoji-icon">🙂</span>
          <span class="emoji-label">راضي</span>
        </div>
        <div class="emoji-option" data-value="1" data-text="سيئ">
          <span class="emoji-icon">🙁</span>
          <span class="emoji-label">سيئ</span>
        </div>
      </div>

      <div class="form-group">
        <label for="feedback">ملاحظاتك (اختياري):</label>
        <textarea id="feedback" rows="3" placeholder="أخبرنا بالمزيد عن تجربتك..."></textarea>
      </div>

      <div class="actions">
        <button type="button" id="back-btn" class="btn btn-secondary">السابق</button>
        <button type="button" id="submit-btn" class="btn">إرسال التقييم</button>
      </div>
    </div>

    <!-- شاشة النجاح -->
    <div id="step-success" class="step">
      <div class="success-icon">✓</div>
      <h2>شكراً لك!</h2>
      <p>تم استلام تقييمك بنجاح ونقدر وقتك لمساعدتنا في تحسين خدماتنا.</p>
      <button type="button" onclick="location.reload()" class="btn">تقييم جديد</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
