<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>تقييم تجربة العميل - JJ's Supermarket</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a1a">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JJ's Supermarket">
  <link rel="apple-touch-icon" href="https://drive.usercontent.google.com/download?id=1vtd5gUi3b-Veh9fh6c3x1e_KmK89gJiN">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <!-- الشعار الرسمي -->
    <div class="brand-header">
      <img src="https://drive.usercontent.google.com/download?id=1vtd5gUi3b-Veh9fh6c3x1e_KmK89gJiN" alt="JJ's Supermarket Logo" id="brand-logo" onerror="this.onerror=null; this.src='logo.png';">
    </div>

    <!-- الشاشة الأولى: بيانات العميل والفاتورة -->
    <div id="step-1" class="step active">
      <h2>مرحباً بك!</h2>
      <p>أدخل بيانات الفاتورة لتسجيل نقاط الولاء ومتابعة التقييم</p>
      
      <form id="customer-form">
        <div class="form-group">
          <label for="customerId">رقم الهاتف:</label>
          <input 
            type="tel" 
            id="customerId" 
            placeholder="أدخل رقم الهاتف" 
            inputmode="numeric" 
            pattern="[0-9]*" 
            autocomplete="off" 
            required>
        </div>

        <div class="form-group">
          <label for="customerName">اسم العميل:</label>
          <input 
            type="text" 
            id="customerName" 
            placeholder="أدخل اسمك الكريم" 
            autocomplete="off" 
            autocorrect="off" 
            spellcheck="false" 
            required>
        </div>

        <div class="form-group">
          <label for="invoiceNo">رقم الفاتورة:</label>
          <input 
            type="text" 
            id="invoiceNo" 
            placeholder="رقم الفاتورة" 
            inputmode="numeric" 
            autocomplete="off" 
            required>
        </div>

        <div class="form-group">
          <label for="invoiceAmount">قيمة الفاتورة (بالدينار):</label>
          <input 
            type="number" 
            id="invoiceAmount" 
            placeholder="مثال: 15.50" 
            step="0.01" 
            min="0.1" 
            inputmode="decimal" 
            required>
        </div>

        <button type="submit" class="btn btn-primary">التالي</button>
      </form>
    </div>

    <!-- الشاشة الثانية: التقييم بالإيموجي -->
    <div id="step-2" class="step">
      <h2>كيف كانت تجربتك اليوم؟</h2>
      <p id="welcome-msg"></p>

      <div class="rating-emojis">
        <div class="emoji-option" data-value="5" data-text="راضي جداً">
          <span class="emoji-icon">🤩</span>
          <span class="emoji-label">راضي جداً</span>
        </div>
        <div class="emoji-option" data-value="3" data-text="راضي">
          <span class="emoji-icon">🙂</span>
          <span class="emoji-label">راضي</span>
        </div>
        <div class="emoji-option" data-value="1" data-text="سيئ">
          <span class="emoji-icon">🙁</span>
          <span class="emoji-label">سيئ</span>
        </div>
      </div>

      <div class="form-group">
        <label for="feedback">ملاحظاتك (اختياري):</label>
        <textarea id="feedback" rows="3" placeholder="أخبرنا بالمزيد عن تجربتك..."></textarea>
      </div>

      <div class="actions">
        <button type="button" id="back-btn" class="btn btn-secondary">السابق</button>
        <button type="button" id="submit-btn" class="btn btn-primary">إرسال التقييم</button>
      </div>
    </div>

    <!-- شاشة النجاح وعرض النقاط المكتسبة -->
    <div id="step-success" class="step">
      <div class="success-icon">✓</div>
      <h2>شكراً لك!</h2>
      <p>تم استلام تقييمك وتسجيل نقاط الفاتورة بنجاح.</p>

      <!-- شارة احتساب النقاط المباشرة -->
      <div class="loyalty-badge">
        <span class="badge-icon">🎉</span>
        <div class="badge-text">
          <strong id="earned-points-display">+0 نقطة ولاء</strong>
          <small id="invoice-summary-display">عن فاتورة بقيمة 0 دينار</small>
        </div>
      </div>

      <button type="button" onclick="resetApp()" class="btn btn-primary">تقييم جديد</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
