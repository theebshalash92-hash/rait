<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>تقييم تجربة العميل - JJ's Supermarket</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JJ's Supermarket">
  <link rel="apple-touch-icon" href="logo.png">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- اللوغو أعلى الشاشة خارج البطاقة -->
  <div class="header-logo-container">
    <img src="logo.png" alt="JJ's Supermarket Logo" id="top-logo" onerror="this.style.display='none'; document.getElementById('logo-text-fallback').style.display='block';">
    <div id="logo-text-fallback" class="logo-text-fallback" style="display: none;">JJ's SUPERMARKET</div>
  </div>

  <div class="card">
    <!-- الشاشة الأولى: بيانات العميل -->
    <div id="step-1" class="step active">
      <h2>مرحباً بك!</h2>
      <p>يرجى إدخال بياناتك لمتابعة التقييم</p>
      
      <form id="customer-form">
        <div class="form-group">
          <label for="customerId">رقم العميل / الهاتف:</label>
          <input 
            type="tel" 
            id="customerId" 
            placeholder="أدخل رقم الهاتف" 
            inputmode="numeric" 
            pattern="[0-9]*" 
            autocomplete="off" 
            required>
        </div>

        <div class="form-group">
          <label for="customerName">اسم العميل:</label>
          <input 
            type="text" 
            id="customerName" 
            placeholder="أدخل اسمك الكريم" 
            autocomplete="off" 
            autocorrect="off" 
            spellcheck="false" 
            required>
        </div>

        <button type="submit" class="btn">التالي</button>
      </form>
    </div>

    <!-- الشاشة الثانية: التقييم بالإيموجي -->
    <div id="step-2" class="step">
      <h2>كيف كانت تجربتك اليوم؟</h2>
      <p id="welcome-msg"></p>

      <div class="rating-emojis">
        <div class="emoji-option" data-value="5" data-text="راضي جداً">
          <span class="emoji-icon">🤩</span>
          <span class="emoji-label">راضي جداً</span>
        </div>
        <div class="emoji-option" data-value="3" data-text="راضي">
          <span class="emoji-icon">🙂</span>
          <span class="emoji-label">راضي</span>
        </div>
        <div class="emoji-option" data-value="1" data-text="سيئ">
          <span class="emoji-icon">🙁</span>
          <span class="emoji-label">سيئ</span>
        </div>
      </div>

      <div class="form-group">
        <label for="feedback">ملاحظاتك (اختياري):</label>
        <textarea id="feedback" rows="3" placeholder="أخبرنا بالمزيد عن تجربتك..."></textarea>
      </div>

      <div class="actions">
        <button type="button" id="back-btn" class="btn btn-secondary">السابق</button>
        <button type="button" id="submit-btn" class="btn">إرسال التقييم</button>
      </div>
    </div>

    <!-- شاشة النجاح -->
    <div id="step-success" class="step">
      <div class="success-icon">✓</div>
      <h2>شكراً لك!</h2>
      <p>تم استلام تقييمك بنجاح ونقدر وقتك لمساعدتنا في تحسين خدماتنا.</p>
      <button type="button" onclick="resetApp()" class="btn">تقييم جديد</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
